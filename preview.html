<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebSlinger Preview</title>
<style>
  :root { --bg:#050508; --panel:#0C0D12; --line:#2A1A22; --fg:#E4DEE2; --muted:#9A96A8; --red:#E3242B; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; padding:32px 16px 48px; }
  main { max-width:1100px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:28px; letter-spacing:.5px; }
  h1 span { color:var(--red); }
  .lede { margin:0 0 32px; color:var(--muted); }
  h2 { font-size:18px; margin:40px 0 4px; }
  p.note { margin:0 0 12px; color:var(--muted); font-size:14px; }
  figure { margin:0; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); }
  figure img { display:block; width:100%; height:auto; }
  .pending { padding:48px 16px; text-align:center; color:var(--muted); font-size:14px; }
  code { font:13px Menlo, Monaco, monospace; color:#FF8C94; }
</style></head>
<body><main>
  <h1>Web<span>Slinger</span></h1>
  <p class="lede">Real screenshots of the theme, taken with <code>screenshots/monthly_sales.R</code>.</p>

  <h2>Positron</h2>
  <p class="note">WebSlinger colour theme, plus the corner web from the optional background extension.</p>
  <figure><img src="screenshots/positron.png" alt="Positron with the WebSlinger theme: near-black editor, crimson keywords, blue functions, pink strings, a faint red spider web in the top-right corner and a dark red status bar"></figure>

  <h2>RStudio</h2>
  <p class="note">WebSlinger editor theme with the web behind the code.</p>
  <figure><div class="pending">Screenshot coming soon.</div></figure>
</main></body></html>
